name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Budowanie projektu iOS i eksport pliku .ipa
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj archiwum z kodem źródłowym
        run: |
          echo "Rozpakowywanie pliku ZIP..."
          unzip -q -o "AeroNav-iOS-Xcode-Project .zip" -d extracted_code
          cp -R extracted_code/AeroNav-iOS-Xcode/* .
          rm -rf extracted_code
          ls -la

      - name: Wybierz wersję Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app
          xcodebuild -version

      - name: Zainstaluj XcodeGen
        run: brew install xcodegen

      - name: Wygeneruj projekt Xcode (.xcodeproj)
        run: xcodegen generate

      - name: Budowanie aplikacji i tworzenie archiwum (.xcarchive)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project AeroNav.xcodeproj \
            -scheme AeroNav \
            -destination "generic/platform=iOS" \
            -configuration "Release" \
            -archivePath "build/AeroNav.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Spakuj do pliku .ipa (Payload)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/AeroNav.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r -q "AeroNav-iOS.ipa" Payload && cd ..

      - name: Udostępnij gotowy plik .ipa do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: AeroNav-iOS-App-IPA
          path: build/AeroNav-iOS.ipa
          retention-days: 14
