name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Budowanie projektu iOS i eksport pliku .ipa
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Wybierz wersję Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Pobierz platformę iOS (potrzebna dla actool)
        run: |
          xcrun simctl list runtimes
          xcodebuild -downloadPlatform iOS

      - name: Zainstaluj XcodeGen
        run: brew install xcodegen

      - name: Wygeneruj projekt Xcode (.xcodeproj)
        run: xcodegen generate

      - name: Tworzenie archiwum aplikacji (.xcarchive)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project AeroNav.xcodeproj \
            -scheme AeroNav \
            -destination "generic/platform=iOS" \
            -configuration "Release" \
            -archivePath "build/AeroNav.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Eksport struktury do pliku .ipa (Payload)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/AeroNav.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" build/Payload/
          chmod +x build/Payload/AeroNav.app/AeroNav || true
          cd build && zip -r -q "AeroNav-iOS.ipa" Payload && cd ..

      - name: Udostępnij gotowy plik .ipa do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: AeroNav-iOS-App-IPA
          path: build/AeroNav-iOS.ipa
          retention-days: 14
