      - name: Budowanie aplikacji i tworzenie archiwum (.xcarchive)
        run: |
          mkdir -p build
          xcodebuild build \
            -project AeroNav.xcodeproj \
            -scheme AeroNav \
            -destination "generic/platform=iOS" \
            -configuration "Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$(pwd)/build/DerivedData"

      - name: Spakuj do pliku .ipa (Payload)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "AeroNav.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AeroNav.app" -type d | head -n 1)
          fi
          echo "Znaleziono aplikację w: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          chmod +x build/Payload/AeroNav.app/AeroNav || true
          cd build && zip -r -q "AeroNav-iOS.ipa" Payload && cd ..
