name: Auto Unpack & Setup

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

jobs:
  unpack-and-commit:
    name: Rozpakuj pliki ZIP i zaktualizuj repozytorium
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wykryj i rozpakuj paczki ZIP
        run: |
          for ZIP_FILE in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Wypakowuję: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d ./unpacked_temp/
          done

          if [ -d "./unpacked_temp/AeroNav-iOS-Xcode" ]; then
            cp -r ./unpacked_temp/AeroNav-iOS-Xcode/* ./
            rm -rf ./unpacked_temp
          fi

      - name: Zatwierdź i wyślij rozpakowane pliki na GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Brak nowych zmian."
          else
            git commit -m "chore(ci): Automatyczne rozpakowanie plików projektu"
            git push origin main
          fi
