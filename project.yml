name: AeroNav
options:
  bundleIdPrefix: com.aeronav
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

targets:
  AeroNav:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AeroNav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeronav.navigation
        PRODUCT_NAME: AeroNav
        INFOPLIST_FILE: AeroNav/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
